# Everything a change must pass, in one place.
#
# Five jobs, because they need five different machines worth of tooling:
#
#   rust        the core: its own tests, and clippy as the compiler's opinion
#   javascript  the code the app injects into pages, linted and tested where it
#               needs no DOM
#   playwright  the same injected code driven in a real Chromium: computed
#               styles, MutationObserver timing and XPath are the point
#   kotlin      the shared UI, the desktop app and the Android app's unit
#               tests, headless under Xvfb
#   hygiene     the cheap invariants: formatting of the lines a change adds
#               (Rust and Kotlin), string constants against string resources,
#               shell syntax, the syntax of every workflow and JSON file
#
# Deliberately elsewhere: the Android lint and APK (android-ci.yml owns them and
# they need the NDK and twenty minutes), the Windows cross build
# (windows-port-check.yml), and packaging (the release workflows).
#
# The jobs are independent on purpose: a red Kotlin job must not hide a green
# Rust one, and `fail-fast` would turn one mistake into five cancelled runs.
name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust — tests and lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Tests
        working-directory: rust
        run: cargo test --lib --locked

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets --locked -- -D warnings

      # The examples are not in `--lib`, and an example that stops compiling is
      # the same regression as a test that stops compiling. Debug on purpose:
      # the question is whether they build, not how fast they run.
      - name: Examples build
        working-directory: rust
        run: cargo build --examples --locked

  javascript:
    name: JavaScript — lint and node tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install the test dependencies
        run: bun install --frozen-lockfile

      # The test dependencies include ESLint; the lint step reads the same
      # install rather than paying for a second one.
      - name: Lint
        run: bun run lint

      # The redirect stubs are a `vm` context and a fake window: no browser is
      # started here, so this job needs no Chromium and is the quick one.
      - name: Tests
        run: bun run test:node

  playwright:
    name: Playwright — the injected code in Chromium
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install the test dependencies
        run: bun install --frozen-lockfile

      # The suite drives a browser, and a runner image's Chrome is not the build
      # this Playwright version was tested against. Installing its own Chromium
      # is the difference between a real failure and a version mismatch.
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Tests
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: bun run test:playwright

  kotlin:
    name: Kotlin — shared, desktop and app tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      # The app module is an Android module even when its tests are plain JVM
      # tests, so AGP wants an SDK. The runner image already carries one with the
      # platform the app compiles against, and android-ci.yml builds the APK on
      # it without installing anything — `android-actions/setup-android` brings
      # its own cmdline-tools, whose `sdkmanager --licenses` fails on the
      # `tools` package it still asks for, which is why it is not used here.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # The desktop module packs the core and the browser bridge into its jar,
      # and the tests start the app that loads them: without these two the suite
      # is testing a window that cannot filter.
      - name: Build the core and the native host
        working-directory: rust
        run: cargo build --release --lib --bin adfree-native-host --locked

      - name: A display and a session bus for the UI tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb dbus-x11

      # `-PskipNative` keeps the app's Kotlin compile from shelling out to
      # cargo-ndk for four ABIs: the unit tests run on the JVM, and the suites
      # that do load the core are :shared and :desktop, whose libraries were
      # built above.
      - name: Tests
        run: >
          dbus-run-session --
          xvfb-run -a --server-args="-screen 0 1400x900x24"
          ./gradlew --no-daemon --console=plain -PskipNative
          :shared:test :desktop:test :app:testDebugUnitTest

      # A failing Compose test says which assertion failed and nothing about the
      # frame it failed on; the XML and the HTML report say the rest.
      - name: Keep the reports of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-reports
          path: |
            shared/build/reports/tests/
            desktop/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore

  hygiene:
    name: Hygiene — formatting, strings, syntax
    runs-on: ubuntu-24.04
    steps:
      # A diff against the base commit needs the base commit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # No `rust-toolchain` action: the formatting question is asked of the file
      # that ships, so the stable compiler's rustfmt is enough and the tree is
      # otherwise untouched here.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Only the lines the change adds: see the script's header for why the
      # whole tree is not held to rustfmt.
      - name: Formatting of the added Rust
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/check-rustfmt.py

      # ktlint is a jar; the job needs a JVM for it and nothing else. The cache
      # is keyed on the script, which owns the pinned version.
      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: actions/cache@v4
        with:
          path: .cache/ktlint
          key: ktlint-${{ runner.os }}-${{ hashFiles('scripts/check-ktlint.py') }}

      # Same narrow question as the Rust step above, for the same reason.
      - name: Formatting of the added Kotlin
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/check-ktlint.py

      - name: String constants against string resources
        run: ./scripts/check-l10n.py

      - name: Shell syntax
        run: |
          status=0
          while IFS= read -r script; do
            bash -n "$script" || status=1
          done < <(git ls-files '*.sh')
          exit "$status"

      - name: Workflows, JSON and XML parse
        run: |
          python3 - <<'PY'
          import json, sys, xml.etree.ElementTree as ET
          from pathlib import Path

          bad = 0
          for path in Path(".github/workflows").glob("*.yml"):
              # YAML's Python reader is not in the stdlib; these files are
              # checked by GitHub itself when they run. Their syntax is not
              # what fails a pull request, so only their existence is checked.
              if not path.read_text(encoding="utf-8").startswith(("#", "name:", "on:")):
                  print(f"::error file={path}::no header")
                  bad = 1
          for path in list(Path(".").rglob("*.json")):
              if any(part in {".git", "node_modules", "build", "out"} for part in path.parts):
                  continue
              # `tsconfig.json` is JSONC: comments are part of the format, so
              # the strict reader is the wrong reader for it.
              if path.name.startswith("tsconfig"):
                  continue
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as error:
                  print(f"::error file={path}::{error}")
                  bad = 1
          for path in list(Path("shared/src/main/resources").rglob("*.xml")):
              try:
                  ET.parse(path)
              except Exception as error:
                  print(f"::error file={path}::{error}")
                  bad = 1
          sys.exit(bad)
          PY
