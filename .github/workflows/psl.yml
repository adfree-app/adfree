# Is the Public Suffix List in the tree still the published one?
#
# The list decides which hosts are the same site — `a.github.io` and
# `b.github.io` are not — and it changes most days, while the copy in
# `rust/assets/` only moves when someone replaces it. This job asks the question
# on a schedule so a stale copy is noticed before it decides a cookie question
# wrongly.
#
# It does not touch the build: nothing here compiles, and the fix is one line —
# `rust/scripts/check-psl.sh --update` — made by hand, because a bot editing
# vendored data is a change nobody reviewed.
name: Public Suffix List freshness

on:
  workflow_dispatch:
  schedule:
    # Mondays, before the week's first working hours.
    - cron: "17 3 * * 1"

jobs:
  freshness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compare the vendored list with the published one
        run: |
          set +e
          ./rust/scripts/check-psl.sh
          status=$?
          set -e
          case "$status" in
            0) echo "::notice::the vendored Public Suffix List is current" ;;
            1)
              echo "::error::the vendored Public Suffix List is stale — run rust/scripts/check-psl.sh --update and commit the file"
              exit 1
              ;;
            *)
              echo "::warning::the published list could not be read; nothing was compared"
              exit 0
              ;;
          esac
