# The MSI, built the way a user would install it.
#
# Runs on a real Windows runner rather than cross-compiling, because the parts
# that can only fail there are the parts worth testing: the MSVC build of the
# core (wepoll is C, compiled by `build.rs`), jpackage's WiX toolchain, and the
# existence of the signed WinDivert pair inside the built jar.
#
# A push builds and keeps the MSI as an artifact — a packaging proof. The release
# pipeline calls this workflow with `publish: true` and the same MSI is attached
# to the tag, so the product a user downloads is the one this job built, not a
# second build with its own idea of the tree.
#
# The tray on Windows is AWT's, not D-Bus: `askForStatusNotifier` keeps the
# session-bus attempt out of a platform that has no session bus, and
# `trayBackend` picks the platform field (see `TrayBackendTest`).
name: Windows build

permissions:
  contents: write

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        description: "Attach the MSI to the release of this version"
        type: boolean
        default: false
  push:
    paths:
      - "rust/src/**"
      - "rust/Cargo.toml"
      - "rust/vendor/**"
      - "desktop/**"
      - "shared/**"
      - ".github/workflows/windows-build.yml"

jobs:
  msi:
    # Two Windows architectures, because they are two products: an x64 machine
    # and an ARM64 one run the same app over the same driver, and both need a
    # package that matches the JRE inside it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build the filtering core
        working-directory: rust
        run: cargo build --release --lib

      - name: The core must export the uniffi surface and the redirect
        working-directory: rust
        shell: bash
        run: |
          dll=target/release/adfree_core.dll
          test -f "$dll" || { echo "no $dll"; exit 1; }
          ls -l "$dll"
          # wepoll and WinDivert are linked by name; a DLL without them is a DLL
          # whose wait set or redirect would fail at run time, not at build time.
          found=$(strings -a "$dll" | grep -c 'uniffi_adfree_core_fn_func_core_redirect_start' || true)
          test "$found" -ge 1 || { echo "redirect entry point missing"; exit 1; }

      - name: Build the MSI
        # `packageMsi`, not `packageReleaseMsi`: the release variant runs
        # ProGuard, which the Linux packages do not, and shrinking an app whose
        # whole job is loading a native library and reflecting over Compose state
        # is a change that deserves its own verification rather than riding along
        # with the first Windows package.
        # No version override: `gradle.properties` carries the release tag's
        # version, and `msiPackageVersion` already clamps it to what WiX accepts.
        # A CI-invented `1.0.<run number>` would publish an installer whose
        # version disagrees with the release it sits in, and MSI upgrades match
        # on that number.
        run: ./gradlew --no-daemon :desktop:packageMsi

      - name: Where it landed
        shell: bash
        run: find desktop/build/compose/binaries -name '*.msi' -exec ls -l {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: adfree-msi-${{ matrix.arch }}
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

      # Only when the release pipeline asked: a push to main must not publish a
      # package nobody reviewed a version for. The tag is read from the release
      # the Android job created, the way the Linux packages find it.
      - name: Attach the MSI to the release
        if: inputs.publish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "releasing into $tag"
          msi=$(find desktop/build/compose/binaries/main/msi -name '*.msi' | head -1)
          test -n "$msi" || { echo "no MSI built"; exit 1; }
          # One asset name per architecture: jpackage writes the same file name
          # for both, and a second upload would replace the first.
          cp "$msi" "adfree-$(basename "$msi" .msi)-$ARCH.msi"
          ls -l adfree-*-"$ARCH".msi
          gh release upload "$tag" adfree-*-"$ARCH".msi --clobber
